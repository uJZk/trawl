name: Publish CloakBrowser image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: cloak-latest
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - name: Download the keyless browser for integration tests
        run: |
          curl -fSL --retry 3 'https://github.com/CloakHQ/CloakBrowser/releases/download/chromium-v146.0.7680.177.5/cloakbrowser-linux-x64.tar.gz' -o "$RUNNER_TEMP/cloak.tar.gz"
          echo '4a12bcde95fa1bb1beef2b41ab5e5c27c36be78e3be3d0dac8c64d705216670e  '"$RUNNER_TEMP/cloak.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cloak"
          tar -xzf "$RUNNER_TEMP/cloak.tar.gz" -C "$RUNNER_TEMP/cloak"
      - name: Test shared API and CDP
        run: |
          CLOAK_TEST_BINARY="$RUNNER_TEMP/cloak/chrome" bun test apps/api/src/cloak.integration.test.ts packages/browser/tests/cloak-config.test.ts packages/browser/tests/cloak-launch.test.ts

  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trawl" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: apps/api/Dockerfile.cloak
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=cloak-${{ matrix.pair }}
          cache-to: type=gha,scope=cloak-${{ matrix.pair }},mode=max
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: cloak-digest-${{ matrix.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trawl" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: cloak-digest-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish latest manifest
        working-directory: /tmp/digests
        run: |
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create -t "${IMAGE}:latest" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:latest"
