services:
  trawl:
    image: ghcr.io/ujzk/trawl:latest
    shm_size: 1gb
    ports:
      - "${LISTEN_IP:-0.0.0.0}:${PORT:-8191}:8191"
      - "127.0.0.1:${CLOAK_CDP_PORT:-9222}:9222"
    environment:
      - TZ
      - CLOAKBROWSER_LICENSE_KEY
      - CLOAKBROWSER_BINARY_PATH
      - CLOAKBROWSER_CACHE_DIR=${CLOAKBROWSER_CACHE_DIR:-/data/cloak-cache}
      - CLOAK_USER_DATA_DIR=${CLOAK_USER_DATA_DIR:-/data/cloakbrowser}
      - CLOAKBROWSER_VERSION
      - CLOAKBROWSER_RELEASE_CHANNEL
      - CLOAKBROWSER_AUTO_UPDATE
      - CLOAK_HEADLESS
      - CLOAK_HUMANIZE
      - CLOAK_HUMAN_PRESET
      - CLOAK_PROXY
      - CLOAK_PROXY_BYPASS
      - CLOAK_LICENSE_ROUTE
      - CLOAK_SESSION_ALIAS_LIMIT
      - CLOAK_EXTRA_ARGS
      - CLOAK_CDP_INTERNAL_PORT
      - BROWSER_SESSION_TTL_SECONDS
      - BROWSER_ACQUIRE_TIMEOUT_MS
      - SCRAPE_MAX_TIMEOUT_MS
      - WAF_DETECTION_ENABLED
      - CLOAK_FINGERPRINT
      - CLOAK_FINGERPRINT_PLATFORM
      - CLOAK_FINGERPRINT_GPU_VENDOR
      - CLOAK_FINGERPRINT_HARDWARE_CONCURRENCY
      - CLOAK_FINGERPRINT_DEVICE_MEMORY
      - CLOAK_FINGERPRINT_SCREEN_WIDTH
      - CLOAK_FINGERPRINT_SCREEN_HEIGHT
      - CLOAK_FINGERPRINT_PLATFORM_VERSION
      - CLOAK_FINGERPRINT_TIMEZONE
      - CLOAK_FINGERPRINT_LOCALE
      - CLOAK_FINGERPRINT_STORAGE_QUOTA
      - CLOAK_FINGERPRINT_TASKBAR_HEIGHT
      - CLOAK_FINGERPRINT_WEBRTC_IP
      - CLOAK_FINGERPRINT_NOISE
      - CLOAK_FINGERPRINT_SAPI_VOICES
      - CLOAK_FINGERPRINT_MAX_TOUCH_POINTS
      - CLOAK_FINGERPRINT_SEARCH_ENGINE
      - CLOAK_FINGERPRINT_ALLOW_3P_COOKIES
      - CLOAK_FINGERPRINT_TRANSPARENT_PROXY
      - CLOAK_FINGERPRINT_TRANSPARENT_PROXY_DNS
      - CLOAK_FINGERPRINT_PORTABLE_COOKIES
    volumes:
      - cloak_data:/data
    restart: unless-stopped

volumes:
  cloak_data:
